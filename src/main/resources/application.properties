spring.application.name=careround-realtime-service

server.port=8088

# JWT (verify only; same RSA public key as every other service)
app.jwt.public-key=${JWT_PUBLIC_KEY}

# Redis pub/sub backplane (same container as auth-service: careround-redis)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Realtime
app.realtime.redis-channel=careround.alerts
app.realtime.allowed-origins=http://localhost:*
app.realtime.session-sweep-ms=30000
